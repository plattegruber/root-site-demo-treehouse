<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="/treehouse-mark.svg" />
		<link rel="manifest" href="/site.webmanifest" />
		<meta name="theme-color" content="#3E8B57" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Mulish:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap"
		/>
		<script type="application/ld+json">
			{
				"@context": "https://schema.org",
				"@type": "Dentist",
				"@id": "https://treehouse.demo.root.site/#practice",
				"name": "Treehouse Pediatric Dentistry",
				"description": "A Brookside pediatric dentist built for brave first-timers and nervous kids. We move at your kid's pace.",
				"url": "https://treehouse.demo.root.site/",
				"logo": "https://treehouse.demo.root.site/logo-wordmark.svg",
				"image": "https://treehouse.demo.root.site/og-image.png",
				"telephone": "+1-816-555-0199",
				"priceRange": "$$",
				"address": {
					"@type": "PostalAddress",
					"streetAddress": "5841 Brookside Blvd",
					"addressLocality": "Kansas City",
					"addressRegion": "MO",
					"postalCode": "64113",
					"addressCountry": "US"
				},
				"openingHoursSpecification": [
					{
						"@type": "OpeningHoursSpecification",
						"dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday"],
						"opens": "08:00",
						"closes": "17:00"
					},
					{
						"@type": "OpeningHoursSpecification",
						"dayOfWeek": ["Friday"],
						"opens": "08:00",
						"closes": "13:00"
					}
				],
				"areaServed": "Kansas City, MO",
				"medicalSpecialty": "Pediatric"
			}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
